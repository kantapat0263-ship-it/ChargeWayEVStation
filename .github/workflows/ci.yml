name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # เฝ้าระวังช่องโหว่ — ล้มถ้าเจอระดับ high ขึ้นไป (moderate/low แค่เตือน)
      - name: Security audit (fail on high+)
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # ใส่ค่าจำลองให้ build ผ่านใน CI (map จริงใช้ค่าใน Vercel)
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: "ci-placeholder"
